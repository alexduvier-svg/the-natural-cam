plugins { id 'com.android.application' }

android {
    namespace 'br.com.duvier.thenaturalcam'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'br.com.duvier.thenaturalcam.codex'
        minSdk 31
        targetSdk 36
        versionCode 70
        versionName '1.27.4-codex'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
        // Orçamento de memória de teste; não comprova detalhe óptico nem desempenho no aparelho.
        unitTests.all { maxHeapSize = "512m" }
    }
    androidResources { noCompress 'tflite' }
    packaging { jniLibs { useLegacyPackaging = false } }
}

dependencies {
    implementation 'com.google.ai.edge.litert:litert:1.4.1'
    // GPU para a redução de ruído por rede (NAFNet); sem GPU cai para a CPU
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.1'
    testImplementation 'junit:junit:4.13.2'
}
