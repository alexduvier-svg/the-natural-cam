plugins { id 'com.android.application' }

android {
    namespace 'br.com.duvier.thenaturalcam'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'br.com.duvier.thenaturalcam'
        minSdk 31
        targetSdk 36
        versionCode 127
        versionName '1.41.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled false
        }
        // "X Cam" (pedido do usuário 14/11): a mesma câmera instalada AO LADO do The Natural Cam,
        // com outro identificador, para comparar foto a foto sem desinstalar a versão aprovada.
        // Nome do app em src/xcam/res. Compilar: ./gradlew assembleXcam
        xcam {
            initWith debug
            applicationIdSuffix '.xcam'
            versionNameSuffix '-xcam'
            matchingFallbacks = ['debug']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
        // mesmo limite de memória do app no celular (largeHeap): prova que 28 MP cabe
        unitTests.all { maxHeapSize = "512m" }
    }
    androidResources { noCompress 'tflite' }
    packaging { jniLibs { useLegacyPackaging = false } }
}

dependencies {
    // EXIF completo (LensMake/LensModel): o ExifInterface do sistema descarta essas tags
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.ai.edge.litert:litert:1.4.1'
    // GPU para a redução de ruído por rede (NAFNet); sem GPU cai para a CPU
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.1'
    testImplementation 'junit:junit:4.13.2'
}
